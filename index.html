<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mitschrift</title>
    <meta name="theme-color" content="#5B5BD6" />
    <meta name="description" content="Notizen mit Lern-Blöcken – Karteikarten, Quiz und Lückentext direkt im Text." />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Excalidraw-Schriften aus dem eigenen Ordner statt von esm.sh (siehe excalidrawFonts() in vite.config.ts).
      // Muss vor allen Modulen gesetzt sein: Excalidraw berechnet die Adressen schon beim Laden.
      window.EXCALIDRAW_ASSET_PATH = '%BASE_URL%excalidraw-assets/';
      try {
        const t = localStorage.getItem('mitschrift-theme');
        if (t) document.documentElement.dataset.theme = t;
        const ct = localStorage.getItem('mitschrift-code-theme');
        if (ct) document.documentElement.dataset.codeTheme = ct;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
